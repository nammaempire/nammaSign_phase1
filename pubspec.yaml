name: nammasign_phase1
description: "NammaSign - Ad-Tech Marketplace (Phase 1)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ---- Firebase ----
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  google_sign_in: ^6.2.1

  # ---- State management ----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ---- Navigation ----
  go_router: ^14.3.0

  # ---- UI / Fonts / Images ----
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # ---- Utils ----
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.4.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ---- Local storage (settings/cache) ----
  shared_preferences: ^2.3.2

  # ---- Files ----
  # file_selector is maintained by the Flutter team — replaces file_picker
  # which had broken Android plugin registration in its 11.x release.
  file_selector: ^1.0.3
  cross_file: ^0.3.4+2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ---- Code generation ----
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Add custom fonts here if Figma uses any.
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
